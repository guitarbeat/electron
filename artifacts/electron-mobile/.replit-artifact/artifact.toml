kind = "mobile"
previewPath = "/electron-mobile/"
title = "Electron Mobile"
version = "1.0.0"
id = "artifacts/electron-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/electron-mobile/" ]
localPort = 24986

[services.development]
run = "pnpm --filter @workspace/electron-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/electron-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/electron-mobile", "run", "serve" ]

[services.env]
PORT = "24986"
BASE_PATH = "/electron-mobile/"
