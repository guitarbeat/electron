<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Electron" />
    <meta name="application-name" content="Electron" />
    <meta name="theme-color" content="#1d140e" />
    <title>Electron</title>
    <style>body{background:#190f18;}</style>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" data-managed-favicon="electron" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="font-body" data-theme="movies">
    <!-- Liquid glass SVG filter — referenced by backdrop-filter: url(#glassFilter) -->
    <svg id="glass-filter-svg" xmlns="http://www.w3.org/2000/svg"
         style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;">
      <defs>
        <filter id="glassFilter" x="-5%" y="-5%" width="110%" height="110%"
                color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.018 0.022"
                        numOctaves="2" seed="4" stitchTiles="stitch" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise"
                             scale="14" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>

    <script>
      window.__electronDeferredInstallPrompt = null;
      window.addEventListener(
        'beforeinstallprompt',
        function (event) {
          event.preventDefault();
          event.stopImmediatePropagation();
          window.__electronDeferredInstallPrompt = event;
        },
        { capture: true }
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
