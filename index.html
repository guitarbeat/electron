<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaron & Electra's Movie List</title>
    <style>
        /* Base styles */
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: #0a0a0f;
            color: #ffffff;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.5;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #14141f;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a4a;
        }

        /* Global font styles */
        .bg-main { background-color: transparent; }
        
        /* Utility animations */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        
        /* Screen reader only */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }


        /* Spin Wheel Modal */
        .wheel-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 50;
            padding: 1rem;
            animation: fade-in 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        
        .modal-content-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 0;
            max-width: 500px;
        }

        .spin-wheel-wrapper {
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.3s ease-in-out;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            touch-action: none; /* Prevent scrolling on mobile */
            user-select: none; /* Prevent text selection */
            cursor: grab;
            margin-bottom: 1rem;
        }
        body.grabbing, body.grabbing * {
            cursor: grabbing !important;
        }

        .spin-wheel-wrapper.result-state {
            transform: scale(0.6);
        }
        @media (max-width: 640px) {
            .spin-wheel-wrapper.result-state {
                transform: scale(0.5);
            }
        }

        .spin-wheel-container {
            position: relative;
            width: 90vw;
            height: 90vw;
            max-width: 500px;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        .spin-marker {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #ffeb3b; /* Yellow marker */
            z-index: 10;
            filter: drop-shadow(0 -2px 2px rgba(0,0,0,0.4));
        }

        .spin-wheel {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 12px solid #f0e68c;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.7), 0 0 30px rgba(0,0,0,0.6) inset;
            overflow: hidden;
            will-change: transform;
            transition: filter 0.3s ease-in-out;
        }
        
        .spin-wheel.grayscale {
            filter: grayscale(0.8) brightness(0.7);
        }
        
        .spin-wheel-wrapper.locked-state {
            opacity: 0.8;
            cursor: not-allowed;
        }
        
        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 8;
            pointer-events: none;
        }
        
        .lock-icon-wrapper {
            background: rgba(10, 10, 15, 0.95);
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #ff6b9d;
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.4);
            animation: lock-pulse 2s ease-in-out infinite;
        }
        
        @keyframes lock-pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(255, 107, 157, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(255, 107, 157, 0.6);
            }
        }
        
        .lock-icon-wrapper svg {
            color: #ff6b9d;
        }
        
        .locked-content {
            pointer-events: auto;
        }
        
        .locked-content svg {
            color: #ff6b9d;
        }
        
        .spin-hub {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ffffff 60%, #e0e0e0 100%);
            border-radius: 50%;
            border: 5px solid #f0e68c;
            z-index: 6;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.3);
        }

        .spin-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 7;
            pointer-events: none;
        }

        .result-display-container {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background: #1a1a28;
            border-radius: 12px;
            border: 1px solid #2a2a3a;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 107, 157, 0.2);
            text-align: center;
            z-index: 51;
            margin-top: -5rem;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @media (min-width: 640px) {
            .result-display-container {
                padding: 2rem;
                margin-top: -8rem;
            }
        }
        
        .current-movie-display {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
            background: #1a1a28;
            border-radius: 12px;
            border: 1px solid #2a2a3a;
            min-height: 4.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .current-movie-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.2;
            margin: 0;
        }
        @media (max-width: 640px) {
            .current-movie-title {
                font-size: 1.25rem;
            }
        }

    </style>
</head>

</html>
