<!DOCTYPE html>
<html>
<head>
<style>
.page {
  width: 200px;
  height: 300px;
  background: red;
  position: relative;
  transition: clip-path 0.3s;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
}
.page.peek {
  clip-path: polygon(0 0, calc(100% - 40px) 0, 100% 40px, 100% 100%, 0 100%);
}
.fold {
  position: absolute;
  top: 0;
  right: 0;
  width: 40px;
  height: 40px;
  background: linear-gradient(225deg, transparent 50%, white 50%, #ddd 100%);
  box-shadow: -2px 2px 4px rgba(0,0,0,0.3);
  opacity: 0;
  transition: opacity 0.3s;
}
.page.peek .fold {
  opacity: 1;
}
</style>
</head>
<body>
<div class="page" id="p">
  <div class="fold"></div>
</div>
<script>
  setTimeout(() => document.getElementById('p').classList.add('peek'), 1000);
</script>
</body>
</html>
