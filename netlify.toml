[build]
  command = "pnpm run build"
  publish = "artifacts/electron/dist/public"

[[redirects]]
  from = "/api/*"
  to = "https://your-backend-host.example.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/quiz-photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# ORDERING CONSTRAINT: /sw.js no-cache rule MUST appear before the /*.js immutable
# wildcard below. If this rule moves after /*.js, the service worker will be cached
# for one year and updates will stop reaching returning users until the old SW expires.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
