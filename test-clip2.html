<!DOCTYPE html>
<html>
<head>
<style>
.wrapper {
  position: relative;
  width: 200px;
  height: 300px;
  transform-style: preserve-3d;
}
.face {
  position: absolute;
  inset: 0;
  background: red;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  transition: clip-path 0.3s;
}
.wrapper.peek .face {
  clip-path: polygon(0 0, calc(100% - 40px) 0, 100% 40px, 100% 100%, 0 100%);
}
.fold {
  position: absolute;
  top: 0;
  right: 0;
  width: 40px;
  height: 40px;
  background: linear-gradient(225deg, transparent 50%, rgba(255,255,255,0.9) 50%, #eee 100%);
  box-shadow: -2px 2px 4px rgba(0,0,0,0.1);
  border-bottom-left-radius: 6px;
  opacity: 0;
  transition: opacity 0.3s;
  transform: translateZ(2px);
  pointer-events: none;
}
.wrapper.peek .fold {
  opacity: 1;
}
</style>
</head>
<body>
<div class="wrapper" id="w">
  <div class="face"></div>
  <div class="fold"></div>
</div>
<script>
  setTimeout(() => document.getElementById('w').classList.add('peek'), 1000);
</script>
</body>
</html>
