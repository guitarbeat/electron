    <style>
      body{background:#07091a;margin:0;}
      #root:empty{display:flex;align-items:center;justify-content:center;min-height:100dvh;}
      #root:empty::after{content:'';width:36px;height:36px;border:3px solid rgba(244,114,182,0.25);border-top-color:#f472b6;border-radius:50%;animation:spin .7s linear infinite;}

  <body class="font-body" data-theme="movies">
    <div id="root"></div>

    <script>
      window.__electronDeferredInstallPrompt = null;
      window.addEventListener(
        'beforeinstallprompt',
        function (event) {
          event.preventDefault();
          event.stopImmediatePropagation();
          window.__electronDeferredInstallPrompt = event;
        },
        { capture: true }
      );
    </script>
