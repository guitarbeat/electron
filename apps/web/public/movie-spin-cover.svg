<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Atmosphere -->
    <radialGradient id="spinBgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#7e22ce" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#180b26" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080310" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="wheelRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="neonPinkBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="neonGoldBeam" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <filter id="spinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="wheelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="400" height="600" fill="#080310"/>
  <rect width="400" height="600" fill="url(#spinBgGlow)"/>

  <!-- Cinema Spotlights / Light Rays -->
  <polygon points="200,0 0,600 130,600" fill="url(#neonPinkBeam)"/>
  <polygon points="200,0 270,600 400,600" fill="url(#neonGoldBeam)"/>

  <!-- Sparkles, Stars & Floating Casino/Cinema Orbs -->
  <circle cx="55" cy="110" r="4" fill="#fbbf24" opacity="0.85" filter="url(#spinGlow)"/>
  <circle cx="345" cy="125" r="5" fill="#f43f5e" opacity="0.9" filter="url(#spinGlow)"/>
  <circle cx="75" cy="310" r="3.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="325" cy="330" r="4.5" fill="#fef08a" opacity="0.85" filter="url(#spinGlow)"/>
  <circle cx="50" cy="440" r="5" fill="#c084fc" opacity="0.7"/>
  <circle cx="350" cy="460" r="3" fill="#f43f5e" opacity="0.85"/>
  <circle cx="190" cy="50" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="215" cy="75" r="3" fill="#fbbf24" opacity="0.85"/>

  <!-- 4-Point Cinema Sparkle Stars -->
  <path d="M70,85 Q70,98 83,98 Q70,98 70,111 Q70,98 57,98 Q70,98 70,85 Z" fill="#fef08a" opacity="0.9" filter="url(#spinGlow)"/>
  <path d="M330,80 Q330,92 342,92 Q330,92 330,104 Q330,92 318,92 Q330,92 330,80 Z" fill="#f472b6" opacity="0.95" filter="url(#spinGlow)"/>
  <path d="M85,380 Q85,390 95,390 Q85,390 85,400 Q85,390 75,390 Q85,390 85,380 Z" fill="#fde047" opacity="0.85"/>
  <path d="M315,220 Q315,230 325,230 Q315,230 315,240 Q315,230 305,230 Q315,230 315,220 Z" fill="#ec4899" opacity="0.85" filter="url(#spinGlow)"/>

  <!-- Film Reel Strip Curved Behind the Wheel -->
  <g filter="url(#wheelShadow)">
    <path d="M-20,220 C100,140 300,340 420,190" fill="none" stroke="#18181b" stroke-width="26" stroke-linecap="round"/>
    <path d="M-20,220 C100,140 300,340 420,190" fill="none" stroke="#3f3f46" stroke-width="24" stroke-linecap="round"/>
    <path d="M-20,220 C100,140 300,340 420,190" fill="none" stroke="#fbbf24" stroke-width="6" stroke-dasharray="10,12"/>
  </g>

  <!-- Golden Lucky Tickets floating around -->
  <g transform="translate(35, 170) rotate(-24)" filter="url(#wheelShadow)">
    <rect x="0" y="0" width="68" height="40" rx="4" fill="url(#wheelRimGrad)" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="0" cy="20" r="6" fill="#080310"/>
    <circle cx="68" cy="20" r="6" fill="#080310"/>
    <line x1="20" y1="5" x2="20" y2="35" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="28" y="25" fill="#451a03" font-size="10" font-weight="900" font-family="system-ui, sans-serif">LUCKY</text>
  </g>

  <g transform="translate(290, 160) rotate(22)" filter="url(#wheelShadow)">
    <rect x="0" y="0" width="70" height="42" rx="4" fill="#ec4899" stroke="#fbcfe8" stroke-width="1.5"/>
    <circle cx="0" cy="21" r="6" fill="#080310"/>
    <circle cx="70" cy="21" r="6" fill="#080310"/>
    <line x1="22" y1="5" x2="22" y2="37" stroke="#831843" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="30" y="26" fill="#ffffff" font-size="9" font-weight="900" font-family="system-ui, sans-serif">JACKPOT</text>
  </g>

  <!-- MAIN ROULETTE WHEEL -->
  <g transform="translate(200, 265)" filter="url(#wheelShadow)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="128" fill="none" stroke="#f43f5e" stroke-width="4" opacity="0.4" filter="url(#spinGlow)"/>

    <!-- Outer Gold Chassis -->
    <circle cx="0" cy="0" r="124" fill="#180b26" stroke="url(#wheelRimGrad)" stroke-width="8"/>

    <!-- Perimeter Peg Bulbs (12 illuminated casino bulbs) -->
    <!-- 0 deg --> <circle cx="0" cy="-124" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
    <!-- 30 deg --> <circle cx="62" cy="-107" r="4.5" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <!-- 60 deg --> <circle cx="107" cy="-62" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
    <!-- 90 deg --> <circle cx="124" cy="0" r="4.5" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <!-- 120 deg --> <circle cx="107" cy="62" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
    <!-- 150 deg --> <circle cx="62" cy="107" r="4.5" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <!-- 180 deg --> <circle cx="0" cy="124" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
    <!-- 210 deg --> <circle cx="-62" cy="107" r="4.5" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <!-- 240 deg --> <circle cx="-107" cy="62" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
    <!-- 270 deg --> <circle cx="-124" cy="0" r="4.5" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <!-- 300 deg --> <circle cx="-107" cy="-62" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
    <!-- 330 deg --> <circle cx="-62" cy="-107" r="4.5" fill="#ffffff" stroke="#d97706" stroke-width="1"/>

    <!-- Colored Wheel Segments (8 slices, radius 118) -->
    <!-- Slice 1: Vivid Magenta (0 to 45 deg) -->
    <path d="M0,0 L0,-118 A118,118 0 0,1 83.4,-83.4 Z" fill="#ec4899"/>
    <!-- Slice 2: Deep Violet (45 to 90 deg) -->
    <path d="M0,0 L83.4,-83.4 A118,118 0 0,1 118,0 Z" fill="#8b5cf6"/>
    <!-- Slice 3: Cyan / Sky (90 to 135 deg) -->
    <path d="M0,0 L118,0 A118,118 0 0,1 83.4,83.4 Z" fill="#06b6d4"/>
    <!-- Slice 4: Ruby Red (135 to 180 deg) -->
    <path d="M0,0 L83.4,83.4 A118,118 0 0,1 0,118 Z" fill="#e11d48"/>
    <!-- Slice 5: Amber Gold (180 to 225 deg) -->
    <path d="M0,0 L0,118 A118,118 0 0,1 -83.4,83.4 Z" fill="#f59e0b"/>
    <!-- Slice 6: Emerald Teal (225 to 270 deg) -->
    <path d="M0,0 L-83.4,83.4 A118,118 0 0,1 -118,0 Z" fill="#10b981"/>
    <!-- Slice 7: Indigo Night (270 to 315 deg) -->
    <path d="M0,0 L-118,0 A118,118 0 0,1 -83.4,-83.4 Z" fill="#6366f1"/>
    <!-- Slice 8: Coral Orange (315 to 360 deg) -->
    <path d="M0,0 L-83.4,-83.4 A118,118 0 0,1 0,-118 Z" fill="#f97316"/>

    <!-- Subtle slice divider spokes -->
    <line x1="0" y1="0" x2="0" y2="-118" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="83.4" y2="-83.4" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="118" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="83.4" y2="83.4" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="118" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-83.4" y2="83.4" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-118" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-83.4" y2="-83.4" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

    <!-- Genre Icons on Slices -->
    <text x="35" y="-70" font-size="16" text-anchor="middle">🍿</text>
    <text x="75" y="-30" font-size="16" text-anchor="middle">🚀</text>
    <text x="75" y="45" font-size="16" text-anchor="middle">👻</text>
    <text x="35" y="85" font-size="16" text-anchor="middle">💥</text>
    <text x="-35" y="85" font-size="16" text-anchor="middle">🎭</text>
    <text x="-75" y="45" font-size="16" text-anchor="middle">🤠</text>
    <text x="-75" y="-30" font-size="16" text-anchor="middle">💖</text>
    <text x="-35" y="-70" font-size="16" text-anchor="middle">🌟</text>

    <!-- Center Hub & Diamond Bearing -->
    <circle cx="0" cy="0" r="38" fill="#180b26" stroke="url(#wheelRimGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="28" fill="#be185d" stroke="#f472b6" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="#fef08a"/>
    <circle cx="-4" cy="-4" r="5" fill="#ffffff" opacity="0.8"/>

    <!-- Pointer Needle (Top Indicator pointing DOWN to top slice) -->
    <g transform="translate(0, -126)">
      <polygon points="0,22 -14,-6 0,0 14,-6" fill="#fef08a" stroke="#b45309" stroke-width="2" filter="url(#spinGlow)"/>
      <circle cx="0" cy="-6" r="6" fill="#dc2626" stroke="#fef08a" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Title Badge on Poster Bottom -->
  <g transform="translate(200, 495)">
    <rect x="-120" y="-22" width="240" height="44" rx="22" fill="#000000" opacity="0.65" stroke="url(#wheelRimGrad)" stroke-width="1.5"/>
    <text x="0" y="6" fill="#ffffff" font-size="20" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="3">
      SPIN &amp; MATCH
    </text>
  </g>

  <!-- Catchphrase -->
  <text x="200" y="540" fill="#fbcfe8" font-size="12" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="1.5" opacity="0.95">
    LET FATE PICK YOUR MOVIE
  </text>
</svg>
