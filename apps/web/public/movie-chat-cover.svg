<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Atmosphere -->
    <radialGradient id="chatBgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="1"/>
    </radialGradient>

    <!-- Glowing Speech Bubble Gradients -->
    <linearGradient id="bubbleCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="bubblePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <linearGradient id="bubblePurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="lightBeamLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lightBeamRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="chatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Darkness & Atmospheric Radiance -->
  <rect width="400" height="600" fill="#050811"/>
  <rect width="400" height="600" fill="url(#chatBgGlow)"/>

  <!-- Cinema Projector / Spot Beams -->
  <polygon points="200,0 0,550 140,600" fill="url(#lightBeamLeft)"/>
  <polygon points="200,0 260,600 400,550" fill="url(#lightBeamRight)"/>

  <!-- Sparkles & Bokeh Orbs -->
  <circle cx="50" cy="110" r="4" fill="#38bdf8" opacity="0.85" filter="url(#chatGlow)"/>
  <circle cx="340" cy="95" r="5" fill="#f472b6" opacity="0.9" filter="url(#chatGlow)"/>
  <circle cx="70" cy="270" r="3.5" fill="#facc15" opacity="0.8"/>
  <circle cx="330" cy="290" r="4" fill="#38bdf8" opacity="0.8" filter="url(#chatGlow)"/>
  <circle cx="55" cy="450" r="5" fill="#c084fc" opacity="0.7"/>
  <circle cx="350" cy="480" r="3" fill="#f472b6" opacity="0.85"/>
  <circle cx="190" cy="80" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="210" cy="120" r="3" fill="#fde047" opacity="0.85"/>

  <!-- 4-Point Cinema Sparkle Stars -->
  <path d="M65,75 Q65,88 78,88 Q65,88 65,101 Q65,88 52,88 Q65,88 65,75 Z" fill="#67e8f9" opacity="0.9" filter="url(#chatGlow)"/>
  <path d="M335,160 Q335,172 347,172 Q335,172 335,184 Q335,172 323,172 Q335,172 335,160 Z" fill="#f472b6" opacity="0.95" filter="url(#chatGlow)"/>
  <path d="M75,370 Q75,380 85,380 Q75,380 75,390 Q75,380 65,380 Q75,380 75,370 Z" fill="#fde047" opacity="0.85"/>
  <path d="M320,400 Q320,410 330,410 Q320,410 320,420 Q320,410 310,410 Q320,410 320,400 Z" fill="#38bdf8" opacity="0.85"/>

  <!-- Film Strip Wave Traversing Behind Chat Bubbles -->
  <g filter="url(#cardShadow)">
    <path d="M-20,180 C110,240 290,120 420,200" fill="none" stroke="#0f172a" stroke-width="26" stroke-linecap="round"/>
    <path d="M-20,180 C110,240 290,120 420,200" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round"/>
    <path d="M-20,180 C110,240 290,120 420,200" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="8,12"/>
    <circle cx="90" cy="205" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="170" cy="200" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="250" cy="165" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="330" cy="170" r="3" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Left Floating Message Bubble (Cyan Cinephile) -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <path d="M0,20 C0,8.95 8.95,0 20,0 L180,0 C191.05,0 200,8.95 200,20 L200,60 C200,71.05 191.05,80 180,80 L40,80 L10,105 L15,80 L20,80 C8.95,80 0,71.05 0,60 Z"
          fill="url(#bubbleCyanGrad)" stroke="#7dd3fc" stroke-width="2"/>
    <!-- Avatar circle -->
    <circle cx="28" cy="40" r="16" fill="#0f172a" stroke="#bae6fd" stroke-width="2"/>
    <text x="28" y="45" fill="#38bdf8" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🎬</text>
    <!-- Message lines simulation -->
    <rect x="54" y="28" width="125" height="9" rx="4.5" fill="#ffffff" opacity="0.95"/>
    <rect x="54" y="44" width="85" height="8" rx="4" fill="#e0f2fe" opacity="0.85"/>
  </g>

  <!-- Right Floating Message Bubble (Magenta Cinephile) -->
  <g transform="translate(140, 260)" filter="url(#cardShadow)">
    <path d="M0,20 C0,8.95 8.95,0 20,0 L180,0 C191.05,0 200,8.95 200,20 L200,60 C200,71.05 191.05,80 180,80 L185,80 L190,105 L160,80 L20,80 C8.95,80 0,71.05 0,60 Z"
          fill="url(#bubblePinkGrad)" stroke="#fbcfe8" stroke-width="2"/>
    <!-- Avatar circle -->
    <circle cx="172" cy="40" r="16" fill="#0f172a" stroke="#fbcfe8" stroke-width="2"/>
    <text x="172" y="45" fill="#ec4899" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🍿</text>
    <!-- Message lines simulation -->
    <rect x="22" y="28" width="130" height="9" rx="4.5" fill="#ffffff" opacity="0.95"/>
    <rect x="52" y="44" width="100" height="8" rx="4" fill="#fdf2f8" opacity="0.85"/>
  </g>

  <!-- Center Floating Reaction Bubble (Purple Neon) -->
  <g transform="translate(85, 360)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="230" height="52" rx="26" fill="#18181b" stroke="#a855f7" stroke-width="2.5"/>
    <g transform="translate(20, 26)">
      <!-- Animated Reaction Pills -->
      <circle cx="10" cy="0" r="14" fill="#3b82f6" opacity="0.3"/>
      <text x="10" y="5" font-size="14" text-anchor="middle">🔥</text>

      <circle cx="45" cy="0" r="14" fill="#ec4899" opacity="0.3"/>
      <text x="45" y="5" font-size="14" text-anchor="middle">❤️</text>

      <circle cx="80" cy="0" r="14" fill="#eab308" opacity="0.3"/>
      <text x="80" y="5" font-size="14" text-anchor="middle">⭐</text>

      <circle cx="115" cy="0" r="14" fill="#10b981" opacity="0.3"/>
      <text x="115" y="5" font-size="14" text-anchor="middle">💯</text>

      <text x="155" y="4" fill="#e9d5ff" font-size="12" font-weight="800" font-family="system-ui, sans-serif">+12</text>
    </g>
  </g>

  <!-- Neon Glowing Marquee Banner / Title Badge -->
  <g transform="translate(200, 495)">
    <rect x="-120" y="-22" width="240" height="44" rx="22" fill="#000000" opacity="0.65" stroke="url(#bubbleCyanGrad)" stroke-width="1.5"/>
    <text x="0" y="6" fill="#ffffff" font-size="20" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="3">
      MOVIE CHAT
    </text>
  </g>

  <!-- Bottom Catchphrase -->
  <text x="200" y="540" fill="#bae6fd" font-size="12" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="1.5" opacity="0.95">
    LOBBY BANTER &amp; RECS
  </text>
</svg>
