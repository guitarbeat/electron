name: Thermo-Nuclear Code Quality Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.actor == 'guitarbeat'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Thermo-Nuclear Code Quality Review
        run: npx --yes skills@latest add https://github.com/cursor/plugins --skill thermo-nuclear-code-quality-review -y
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
