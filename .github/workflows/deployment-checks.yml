name: Deployment Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment URL to verify (e.g. https://my-app.vercel.app)'
        required: false
        type: string

permissions:
  contents: read
  statuses: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.client_payload.id || github.run_id }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: "Type Check & Lint"
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

  unit-tests:
    name: "Unit Tests"
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm run test:unit

  build-validation:
    name: "Build Validation"
    if: github.event_name != 'repository_dispatch'
    needs: [typecheck-and-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm run build

  deployment-smoke-check:
    name: "Deployment Smoke & Health Verification"
    if: >-
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.environment == 'production' &&
       github.event.client_payload.project.name == 'electra-and-aaron-movies') ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployment commit
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/checkout@v1

      - name: Check out workflow dispatch commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Target Deployment URL
        id: target
        env:
          VERCEL_DEPLOYMENT_URL: ${{ github.event_name == 'repository_dispatch' && 'https://electra-and-aaron-movies.vercel.app' || '' }}
          MANUAL_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          URL="${VERCEL_DEPLOYMENT_URL:-$MANUAL_DEPLOYMENT_URL}"
          if [[ ! "$URL" =~ ^https:// ]]; then
            echo "Missing or invalid HTTPS deployment URL" >&2
            exit 1
          fi
          echo "Target deployment URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run Deployment Smoke Tests
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/smoke-test-deployment.mjs "${{ steps.target.outputs.url }}"

      - name: Notify Vercel Deployment Check Status
        if: always() && github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - electron: e2e-smoke-tests"
          state: ${{ job.status == 'success' && 'success' || 'failure' }}
          token: ${{ secrets.GITHUB_TOKEN }}
