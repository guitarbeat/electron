name: Deployment Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  repository_dispatch:
    types: [vercel.deployment.ready]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment URL to verify (e.g. https://my-app.vercel.app)'
        required: false
        type: string

permissions:
  contents: read
  statuses: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.client_payload.deploymentId || github.run_id }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: "Type Check & Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm run test:unit

  build-validation:
    name: "Build Validation"
    needs: [typecheck-and-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm run build

  deployment-smoke-check:
    name: "Deployment Smoke & Health Verification"
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.deployment_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Target Deployment URL
        id: target
        run: |
          URL="${{ github.event.client_payload.deploymentUrl || github.event.client_payload.deployment.url || inputs.deployment_url }}"
          echo "Target deployment URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run Deployment Smoke Tests
        run: node scripts/smoke-test-deployment.mjs "${{ steps.target.outputs.url }}"

      - name: Notify Vercel Deployment Check Status
        if: always() && github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - electron: e2e-smoke-tests"
          state: ${{ job.status == 'success' && 'success' || 'failure' }}
          token: ${{ secrets.GITHUB_TOKEN }}
