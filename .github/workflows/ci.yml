name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  typecheck-and-lint:
    name: Type Check, Lint & Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Assert pnpm lockfile exists
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml is missing. setup-node cache: pnpm requires it. Restore the lockfile; do not gitignore it."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Artifact Compliance & Lifecycle
        run: pnpm run check-artifacts

      - name: Validate Repository Boundary & Hygiene
        run: pnpm run check-hygiene

      - name: Type Check
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '20']
    steps:
      - uses: actions/checkout@v7

      - name: Assert pnpm lockfile exists
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml is missing. setup-node cache: pnpm requires it. Restore the lockfile; do not gitignore it."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        env:
          NODE_ENV: test
        run: pnpm run test

  build:
    name: Build & Bundle Verification
    needs: [typecheck-and-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Assert pnpm lockfile exists
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml is missing. setup-node cache: pnpm requires it. Restore the lockfile; do not gitignore it."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Artifact Compliance & Lifecycle
        run: pnpm run check-artifacts

      - name: Build Application
        run: pnpm run build

      - name: Verify Build Outputs
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html is missing after build step."
            exit 1
          fi
          echo "Verified dist/index.html exists."
